services:
  postgres:
    image: postgres:15-alpine
    container_name: task-manager-db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: task-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  kafka:
    image: apache/kafka:4.3.1 # Актуальная версия Kafka 4.x
    container_name: task-manager-kafka
    ports:
      - "29092:29092" # Пробрасываем наружу порт 29092 (чтобы IntelliJ мог достучаться с хоста)
    environment:
      KAFKA_NODE_ID: 1 # Уникальный ID узла в кластере (мы делаем 1 узел)
      KAFKA_PROCESS_ROLES: 'broker,controller' # В KRaft один узел может быть и брокером, и контроллером
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093' # Кто голосует за лидера (сам себя)

      # ★ ГЛАВНЫЙ МОМЕНТ: Слушатели (Listeners) ★
      # INTERNAL (9092) - для общения контейнеров внутри Docker (Kafbat UI)
      # CONTROLLER (9093) - для управления самим кластером Kafka
      # EXTERNAL (29092) - для нашего приложения, запущенного на хосте (в IntelliJ)
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092'

      # Анонсируем адреса: внутри Docker контейнеры должны стучаться на `kafka:9092`,
      # а приложения с хоста — на `localhost:29092`. Если этого не сделать, Kafka
      # скажет клиенту "иди на kafka:9092", и твой Java-код упадет, не зная такого хоста.
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'

      # Указываем протокол (PLAINTEXT = без шифрования и паролей)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL' # Брокеры между собой общаются по INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER' # Имя листенера для управления
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Фактор репликации = 1 (так как у нас 1 узел)

  kafbat-ui:
      image: ghcr.io/kafbat/kafka-ui:latest # Современный UI, поддерживающий KRaft (Kafdrop не умеет)
      container_name: task-manager-kafbat-ui
      ports:
        - "9000:8080" # Снаружи доступен на 9000, внутри слушает 8080
      environment:
        KAFKA_CLUSTERS_0_NAME: local-kafka # Имя кластера в UI
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092 # Подключаемся по внутреннему адресу (INTERNAL)
      depends_on:
        - kafka # Запускать только после старта Kafka
volumes:
  postgres_data:
  redis_data: